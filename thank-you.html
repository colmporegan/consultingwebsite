<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Lighthouse AI Consulting</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #182338;
  --paper: #EEE2CC;
  --accent: #E98A5B;
  --accent-dark: #C56A3C;
  --muted: #5b5343;
  --hero-grad: linear-gradient(180deg, #101a30 0%, #233150 40%, #6a4a63 74%, #c9885f 100%);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; color: var(--ink); background: var(--paper); line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; }
.container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none; transition: all 0.2s; cursor: pointer; border: none; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); transform: translateY(-1px); }
.btn-outline { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }

/* NAV */
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(10,22,40,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 0 24px; }
.nav-inner { max-width: 1120px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 64px; }
.nav-logo { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 1.15rem; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.nav-logo svg { flex-shrink: 0; }
.nav-logo em { font-style: normal; color: var(--accent); }
.nav-links { display: flex; gap: 32px; align-items: center; }
.nav-links a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
.nav-links a:hover { color: #fff; }
.nav-links .btn { padding: 9px 20px; font-size: 13px; color: #fff; font-weight: 700; }

/* THANK YOU */
.thank-you {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 64px;
}
.thank-you-card {
  text-align: center;
  max-width: 560px;
  padding: 60px 40px;
}
.thank-you-icon {
  width: 72px;
  height: 72px;
  background: rgba(233,138,91,0.12);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 28px;
  font-size: 32px;
  color: var(--accent-dark);
}
.thank-you-card h1 {
  font-size: clamp(1.8rem, 3vw, 2.4rem);
  margin-bottom: 16px;
}
.thank-you-card p {
  font-size: 1.05rem;
  color: var(--muted);
  line-height: 1.75;
  margin-bottom: 14px;
}
.thank-you-card .ctas {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 32px;
}

/* FOOTER */
footer { background: var(--ink); color: rgba(255,255,255,0.5); padding: 36px 0; font-size: 0.85rem; position: fixed; bottom: 0; left: 0; right: 0; }
.footer-bottom { display: flex; justify-content: center; align-items: center; }

/* WHO-I-HELP DROPDOWN */
.nav-dropdown { position: relative; display: inline-flex; }
.nav-drop-toggle { background: none; border: none; cursor: pointer; font-family: inherit; color: rgba(255,255,255,0.6); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; padding: 0; transition: color 0.2s; }
.nav-drop-toggle:hover, .nav-dropdown.open .nav-drop-toggle { color: #fff; }
.nav-drop-toggle .chev { transition: transform .2s ease; }
.nav-dropdown.open .nav-drop-toggle .chev { transform: rotate(180deg); }
.nav-drop-menu { position: absolute; top: calc(100% + 20px); left: 50%; transform: translateX(-50%); min-width: 232px; background: rgba(10,22,40,0.98); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 8px; box-shadow: 0 24px 50px -20px rgba(0,0,0,0.65); display: none; flex-direction: column; gap: 2px; z-index: 120; }
.nav-dropdown.open .nav-drop-menu { display: flex; }
.nav-drop-menu a { display: block; padding: 11px 14px; border-radius: 8px; font-size: 14px; color: rgba(255,255,255,0.75); }
.nav-drop-menu a small { display: block; font-size: 11.5px; color: rgba(255,255,255,0.42); margin-top: 3px; font-weight: 400; }
.nav-drop-menu a:hover { background: rgba(255,255,255,0.06); color: #fff; }
.nav-toggle { display: none; background: none; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 8px 9px; cursor: pointer; }
.nav-toggle span { display: block; width: 20px; height: 2px; background: #fff; border-radius: 2px; transition: transform .25s ease, opacity .2s ease; }
.nav-toggle span + span { margin-top: 5px; }
nav.open .nav-toggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
nav.open .nav-toggle span:nth-child(2) { opacity: 0; }
nav.open .nav-toggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
@media (max-width: 768px) {
  .nav-toggle { display: block; }
  .nav-links {
    display: none; position: absolute; top: 100%; left: 0; right: 0;
    background: rgba(10,22,40,0.98); backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-direction: column; align-items: stretch; gap: 0;
    padding: 8px 24px 18px;
  }
  nav.open .nav-links { display: flex; }
  .nav-links a { display: block; padding: 13px 0; font-size: 15px; color: rgba(255,255,255,0.82); border-bottom: 1px solid rgba(255,255,255,0.07); }
  .nav-links a:last-child { border-bottom: none; }
  .nav-links .btn { margin-top: 14px; justify-content: center; }
  .nav-dropdown { display: block; width: 100%; position: static; }
  .nav-drop-toggle { width: 100%; justify-content: space-between; padding: 13px 0; font-size: 15px; color: rgba(255,255,255,0.82); border-bottom: 1px solid rgba(255,255,255,0.07); }
  .nav-drop-menu { position: static; transform: none; min-width: 0; background: none; border: none; box-shadow: none; padding: 2px 0 6px 16px; backdrop-filter: none; border-radius: 0; }
  .nav-drop-menu a { padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .nav-drop-menu a small { display: none; }
  .thank-you-card { padding: 40px 20px; }
}
@media (max-width: 520px) {
  .nav-logo { font-size: 0.92rem; gap: 8px; }
  .nav-logo svg { width: 24px; height: 24px; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <svg width="32" height="32" viewBox="-20 -2 68 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="34" r="32" fill="none" stroke="#fff" stroke-width="1.5"/>
        <rect x="8" y="22" width="12" height="28" fill="#fff"/>
        <path d="M14 10 L8 22 L20 22Z" fill="#fff"/>
        <circle cx="14" cy="14" r="4" fill="#F4B26A"/>
        <line x1="-4" y1="14" x2="6" y2="14" stroke="#F4B26A" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="22" y1="14" x2="32" y2="14" stroke="#F4B26A" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="2" y1="4" x2="8" y2="10" stroke="#F4B26A" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
        <line x1="26" y1="4" x2="20" y2="10" stroke="#F4B26A" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
        <rect x="8" y="34" width="12" height="4" fill="#F4B26A"/>
        <path d="M-12 54 C-4 50, 4 56, 14 52 C24 48, 32 54, 40 50" fill="none" stroke="#F4B26A" stroke-width="1" opacity="0.35"/>
      </svg>
      Lighthouse <em>AI</em> Consulting
    </a>
    <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <div class="nav-links">
      <a href="index.html#services">Services</a>
      <a href="/real-estate">Real Estate</a>
      <a href="/healthcare-staffing">Healthcare Staffing</a>
      <a href="case-studies.html">Case Studies</a>
      <a href="index.html#why">Why Us</a>
      <a href="index.html#faq">FAQ</a>
      <a href="index.html#contact" class="btn btn-primary">Book a Call</a>
    </div>
  </div>
</nav>

<section class="thank-you">
  <div class="container">
    <div class="thank-you-card">
      <div class="thank-you-icon">✓</div>
      <h1>Thank you!</h1>
      <p>Your form has been successfully submitted. I'll reach out to you within 24 hours to schedule a call.</p>
      <div class="ctas">
        <a href="index.html" class="btn btn-primary">Back to Home</a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-bottom" style="justify-content: center;">
      <span>&copy; 2026 Lighthouse AI Consulting. All rights reserved.</span>
    </div>
  </div>
</footer>

<script>
(function () {
  var nv = document.querySelector('nav');
  var tg = nv && nv.querySelector('.nav-toggle');
  if (!nv || !tg) return;
  tg.addEventListener('click', function () {
    var open = nv.classList.toggle('open');
    tg.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  nv.querySelectorAll('.nav-links a').forEach(function (a) {
    a.addEventListener('click', function () {
      nv.classList.remove('open');
      tg.setAttribute('aria-expanded', 'false');
    });
  });
})();
</script>
<script>
(function () {
  document.querySelectorAll('.nav-drop-toggle').forEach(function (t) {
    t.addEventListener('click', function (e) { e.stopPropagation(); t.parentElement.classList.toggle('open'); });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.nav-dropdown')) {
      document.querySelectorAll('.nav-dropdown.open').forEach(function (d) { d.classList.remove('open'); });
    }
  });
})();
</script>
</body>
</html>
